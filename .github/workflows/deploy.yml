name: Build and push container image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT_PUBLIC }}
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "value=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/torifo/business-card:latest
            ghcr.io/torifo/business-card:${{ steps.tag.outputs.value }}

      - name: Summary
        run: |
          echo "Pushed: ghcr.io/torifo/business-card:${{ steps.tag.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "Pushed: ghcr.io/torifo/business-card:latest" >> $GITHUB_STEP_SUMMARY
          echo "Deploy from the VPS: \`./deploy.sh ${{ steps.tag.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
